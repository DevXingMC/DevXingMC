name: Refresh profile visuals

on:
  schedule:
    - cron: '23 22 * * *' # Daily at 06:23 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vendor/**'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned renderer
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Render GitHub statistics
        run: npm run render:stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=%233b82f6&color_dots=%23ebedf0,%23bae6fd,%237dd3fc,%2338bdf8,%230284c7
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%2370d8ef&color_dots=%23162132,%231c4260,%23256b8d,%2336a3c1,%2370d8ef

      - name: Refresh official streak card
        run: python3 scripts/refresh_streak.py

      - name: Validate upstream component images
        run: python3 scripts/prepare_assets.py

      - name: Commit refreshed visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/github-snake.svg assets/github-snake-dark.svg assets/streak-stats.svg
          if git diff --cached --quiet; then
            echo 'Profile visuals are already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh profile visuals'
          git pull --rebase origin main
          git push origin HEAD:main
