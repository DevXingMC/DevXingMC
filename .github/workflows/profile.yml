name: Refresh profile visuals

on:
  schedule:
    - cron: '23 22 * * *' # Daily at 06:23 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Render GitHub statistics
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&bg_color=0d1424&title_color=70d8ef&text_color=bfccde&icon_color=70d8ef&border_color=26354c&border_radius=16&card_width=460&custom_title=GitHub%20activity&disable_animations=true
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=%233b82f6&color_dots=%23ebedf0,%23bae6fd,%237dd3fc,%2338bdf8,%230284c7
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%2370d8ef&color_dots=%23162132,%231c4260,%23256b8d,%2336a3c1,%2370d8ef

      - name: Validate visuals and build reduced-motion fallback
        run: python3 scripts/prepare_assets.py

      - name: Commit refreshed visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/github-snake.svg assets/github-snake-dark.svg assets/contributions.svg
          if git diff --cached --quiet; then
            echo 'Profile visuals are already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh profile visuals'
          git pull --rebase origin main
          git push origin HEAD:main
